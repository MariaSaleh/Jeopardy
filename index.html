<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jeopardy</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Roboto:wght@400;700&display=swap');

        :root {
            --bg-dark: #00041a;
            --studio-blue: #060ce9;
            --deep-navy: #000830;
            --accent-gold: #ffcc00;
            --gold-glow: rgba(255, 204, 0, 0.4);
            --glass: rgba(255, 255, 255, 0.1);
            --text-main: #ffffff;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background: radial-gradient(circle at center, #001253 0%, var(--bg-dark) 100%);
            color: var(--text-main);
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        header {
            flex-shrink: 0;
            background: linear-gradient(180deg, #111f91 0%, #000830 100%);
            padding: 15px 40px;
            border-bottom: 4px solid var(--accent-gold);
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            z-index: 100;
        }

        header h1 {
            font-family: 'Oswald', sans-serif;
            font-size: 2.2rem;
            letter-spacing: 4px;
            margin: 0;
            background: linear-gradient(to bottom, #fff 30%, var(--accent-gold) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        #main-container {
            flex-grow: 1;
            overflow-y: auto;
            padding: 25px;
            display: flex;
            justify-content: center;
        }

        #game-board {
            display: grid;
            grid-template-columns: repeat(5, 1fr); 
            gap: 12px;
            width: 100%;
            max-width: 1300px;
        }

        .category-title {
            font-family: 'Oswald', sans-serif;
            background: linear-gradient(145deg, #060ce9, #00055a);
            border: 2px solid var(--accent-gold);
            padding: 15px 5px;
            text-align: center;
            font-weight: 700;
            text-transform: uppercase;
            border-radius: 4px;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .card {
            background: linear-gradient(145deg, #060ce9, #0409a1);
            border: 2px solid rgba(255,255,255,0.4);
            aspect-ratio: 1.6 / 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Oswald', sans-serif;
            font-size: 2rem;
            color: var(--accent-gold);
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.3s ease;
        }

        .card:hover {
            transform: scale(1.05);
            border-color: var(--accent-gold);
            box-shadow: 0 0 20px var(--gold-glow);
        }

        .card.disabled {
            background: #000624;
            color: #112255;
            border-color: #0c163a;
            pointer-events: none;
        }

        #team-bar {
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 20px;
            background: rgba(0,0,0,0.85);
            border-top: 2px solid rgba(255,255,255,0.1);
        }

        .team-box {
            background: var(--glass);
            border: 2px solid rgba(255,255,255,0.1);
            padding: 15px 25px;
            min-width: 160px;
            text-align: center;
            border-radius: 12px;
            transition: 0.4s;
        }

        .active-turn {
            border-color: var(--accent-gold);
            background: rgba(6, 12, 233, 0.4);
            box-shadow: 0 0 25px var(--gold-glow);
            transform: scale(1.1);
        }

        #setup-overlay, #modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.96);
            z-index: 2000;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .modal-content, .setup-card {
            background: linear-gradient(135deg, #001253 0%, #00041a 100%);
            border: 3px solid var(--accent-gold);
            padding: 40px;
            width: 90%;
            max-width: 800px;
            text-align: center;
            border-radius: 24px;
        }

        #media-container {
            margin-bottom: 20px;
            max-height: 350px;
            overflow: hidden;
            display: none;
            background: #000;
            border-radius: 12px;
            border: 1px solid var(--accent-gold);
        }

        video, audio { width: 100%; }

        .btn {
            font-family: 'Oswald', sans-serif;
            padding: 12px 24px;
            font-weight: 700;
            cursor: pointer;
            border: none;
            border-radius: 50px;
            text-transform: uppercase;
            transition: 0.2s;
        }

        .btn-nav { background: transparent; border: 2px solid var(--accent-gold); color: var(--accent-gold); }
        .btn-main { background: var(--accent-gold); color: #000; }
        .btn-correct { background: #00ff88; color: #004422; flex: 1; }
        .btn-wrong { background: #ff3366; color: #fff; flex: 1; }

        input[type="text"], input[type="number"] {
            background: rgba(255,255,255,0.1);
            border: 1px solid var(--accent-gold);
            color: white;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            font-size: 1rem;
        }

        /* Specific styling for the setup rows */
        .team-row {
            display: flex;
            gap: 10px;
            justify-content: center;
            align-items: center;
            margin-bottom: 12px;
            width: 100%;
        }

        .remove-btn {
            background: #ff3366;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px 15px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div id="setup-overlay">
    <div class="setup-card">
        <h1>GAME SETUP</h1>
        <div id="team-inputs">
            <div class="team-row">
                <input type="text" class="t-name" placeholder="TEAM 1 NAME" style="width: 70%;">
            </div>
            <div class="team-row">
                <input type="text" class="t-name" placeholder="TEAM 2 NAME" style="width: 70%;">
                <button class="remove-btn" onclick="removeTeamInput(this)">✕</button>
            </div>
        </div>
        <button class="btn btn-nav" onclick="addTeamInput()" style="margin-top: 10px;">+ ADD TEAM</button>
        <button class="btn btn-main" onclick="startGame()" style="display:block; width:100%; margin-top:30px; font-size:1.4rem;">ENTER STAGE</button>
    </div>
</div>

<header>
    <h1>JEOPARDY</h1>
    <button class="btn btn-nav" onclick="location.reload()">NEW GAME</button>
</header>

<div id="main-container">
    <div id="game-board"></div>
</div>

<div id="team-bar"></div>

<div id="modal" style="display:none;">
    <div class="modal-content">
        <h2 id="current-player-tag" style="color:var(--accent-gold); font-family:'Oswald'; letter-spacing:1px;"></h2>
        <div id="media-container"></div>
        <div id="display-q" style="font-size: 2.2rem; margin-bottom: 30px; line-height:1.4;"></div>
        <div id="display-a" style="font-size: 1.8rem; color: var(--accent-gold); display: none; margin-bottom: 30px; font-weight:bold;"></div>
        
        <button id="reveal-btn" class="btn btn-main" onclick="revealAnswer()" style="width:100%;">REVEAL ANSWER</button>
        
        <div id="scoring-zone" style="display:none; flex-direction: column; gap: 20px;">
            <div style="display:flex; gap: 15px;">
                <button class="btn btn-correct" onclick="processResult('correct')">CORRECT (+Full)</button>
                <button class="btn btn-wrong" onclick="processResult('wrong')">WRONG (-Half)</button>
            </div>
            <div style="display:flex; gap: 10px; align-items: center; border-top: 1px solid #333; padding-top: 20px;">
                <input type="number" id="custom-score-input" placeholder="Value" style="width: 100px;">
                <button class="btn btn-nav" onclick="processResult('custom')" style="flex:1;">ADD CUSTOM POINTS</button>
            </div>
        </div>
    </div>
</div>

<script>
    let teams = [];
    let currentTeamIndex = 0;
    let activeValue = 0;
    let activeCardNode = null;
    let gameData = null;

    // Load external JSON
    async function loadData() {
        try {
            const response = await fetch('data/game_data.json');
            gameData = await response.json();
        } catch(e) { 
            console.error(e);
            alert("Error: Ensure 'game_data.json' exists and you are running via a local server (http://)."); 
        }
    }

    // Dynamic Team Management
    function addTeamInput() {
        const container = document.getElementById('team-inputs');
        const count = container.querySelectorAll('.team-row').length + 1;
        
        const row = document.createElement('div');
        row.className = 'team-row';
        row.innerHTML = `
            <input type="text" class="t-name" placeholder="TEAM ${count} NAME" style="width: 70%;">
            <button class="remove-btn" onclick="removeTeamInput(this)">✕</button>
        `;
        container.appendChild(row);
    }

    function removeTeamInput(btn) {
        btn.parentElement.remove();
        // Update placeholders for remaining inputs
        const inputs = document.querySelectorAll('.t-name');
        inputs.forEach((input, index) => {
            input.placeholder = `TEAM ${index + 1} NAME`;
        });
    }

    function startGame() {
        const nameInputs = document.querySelectorAll('.t-name');
        const teamBar = document.getElementById('team-bar');
        
        if (nameInputs.length === 0) {
            alert("Please add at least one team!");
            return;
        }

        teamBar.innerHTML = '';
        teams = [];
        
        nameInputs.forEach((input, index) => {
            const name = input.value.trim().toUpperCase() || `TEAM ${index + 1}`;
            teams.push({ id: index, name: name, score: 0 });
            
            const div = document.createElement('div');
            div.className = 'team-box';
            div.id = `box-team-${index}`;
            div.innerHTML = `
                <div style="font-size:0.75rem; color:var(--accent-gold); font-weight:bold; letter-spacing:1px; margin-bottom:5px;">PLAYING</div>
                <div style="font-family:'Oswald'; font-size:1.2rem; margin-bottom:5px;">${name}</div>
                <div id="score-${index}" 
                     contenteditable="true" 
                     onfocus="stripFormatting(this)" 
                     onblur="syncManualScore(${index})" 
                     style="font-size:1.8rem; font-weight:bold; color:var(--accent-gold); cursor:text; outline:none;">$0</div>
            `;
            teamBar.appendChild(div);
        });

        document.getElementById('setup-overlay').style.display = 'none';
        updateTurnUI();
        renderBoard();
    }

    function renderBoard() {
        const board = document.getElementById('game-board');
        board.innerHTML = '';
        
        if (!gameData) return;

        // Headers
        gameData.categories.forEach(cat => {
            const h = document.createElement('div');
            h.className = 'category-title';
            h.innerText = cat.name;
            board.appendChild(h);
        });

        // Rows
        const maxQ = Math.max(...gameData.categories.map(c => c.questions.length));
        for (let i = 0; i < maxQ; i++) {
            gameData.categories.forEach(cat => {
                const qObj = cat.questions[i];
                const card = document.createElement('div');
                card.className = 'card';
                if (qObj) {
                    const val = (qObj.value !== undefined) ? qObj.value : (i + 1) * 100;
                    card.innerText = `$${val}`;
                    card.onclick = () => openQuestion(qObj, val, card);
                } else {
                    card.style.visibility = 'hidden';
                }
                board.appendChild(card);
            });
        }
    }

    function openQuestion(qObj, val, node) {
        activeValue = val;
        activeCardNode = node;
        const mediaBox = document.getElementById('media-container');
        mediaBox.innerHTML = '';
        mediaBox.style.display = 'none';

        if (qObj.video) {
            mediaBox.innerHTML = `<video src="${qObj.video}" controls autoplay></video>`;
            mediaBox.style.display = 'block';
        } else if (qObj.audio) {
            mediaBox.innerHTML = `<audio src="${qObj.audio}" controls autoplay></audio>`;
            mediaBox.style.display = 'block';
        } else if (qObj.image) {
            mediaBox.innerHTML = `<img src="${qObj.image}" style="max-width:100%; max-height:300px; object-fit:contain;">`;
            mediaBox.style.display = 'block';
        }

        document.getElementById('current-player-tag').innerText = `${teams[currentTeamIndex].name}'s ATTEMPT • $${val}`;
        document.getElementById('display-q').innerText = qObj.q;
        document.getElementById('display-a').innerText = qObj.a;
        document.getElementById('display-a').style.display = 'none';
        document.getElementById('scoring-zone').style.display = 'none';
        document.getElementById('reveal-btn').style.display = 'block';
        document.getElementById('modal').style.display = 'flex';
    }

    function revealAnswer() {
        document.getElementById('display-a').style.display = 'block';
        document.getElementById('reveal-btn').style.display = 'none';
        document.getElementById('scoring-zone').style.display = 'flex';
        const media = document.querySelector('#media-container video, #media-container audio');
        if(media) media.pause();
    }

    function processResult(type) {
        const team = teams[currentTeamIndex];
        if (type === 'correct') {
            team.score += activeValue;
        } else if (type === 'wrong') {
            team.score -= (activeValue / 2);
        } else if (type === 'custom') {
            const val = parseInt(document.getElementById('custom-score-input').value);
            if (!isNaN(val)) team.score += val;
        }

        updateScoreDisplay(currentTeamIndex);
        activeCardNode.classList.add('disabled');
        document.getElementById('custom-score-input').value = '';
        
        currentTeamIndex = (currentTeamIndex + 1) % teams.length;
        updateTurnUI();
        
        document.getElementById('modal').style.display = 'none';
        document.getElementById('media-container').innerHTML = '';
    }

    function stripFormatting(el) {
        el.innerText = el.innerText.replace('$', '').replace(',', '');
    }

    function syncManualScore(index) {
        const el = document.getElementById(`score-${index}`);
        const val = parseInt(el.innerText.replace(/[^0-9-]/g, ''));
        teams[index].score = isNaN(val) ? 0 : val;
        updateScoreDisplay(index);
    }

    function updateScoreDisplay(index) {
        const s = teams[index].score;
        const el = document.getElementById(`score-${index}`);
        el.innerText = (s < 0 ? '-$' : '$') + Math.abs(s).toLocaleString();
    }

    function updateTurnUI() {
        teams.forEach((t, i) => {
            const box = document.getElementById(`box-team-${i}`);
            if (box) {
                if (i === currentTeamIndex) box.classList.add('active-turn');
                else box.classList.remove('active-turn');
            }
        });
    }

    loadData();
</script>
</body>
</html>
