<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jeopardy</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Roboto:wght@400;700&display=swap');

        :root {
            --bg-dark: #00041a;
            --studio-blue: #060ce9;
            --deep-navy: #000830;
            --accent-gold: #ffcc00;
            --gold-glow: rgba(255, 204, 0, 0.4);
            --glass: rgba(255, 255, 255, 0.1);
            --text-main: #ffffff;
            --remove-red: #ff3366;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background: radial-gradient(circle at center, #001253 0%, var(--bg-dark) 100%);
            color: var(--text-main);
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        header {
            flex-shrink: 0;
            background: linear-gradient(180deg, #111f91 0%, #000830 100%);
            padding: 15px 40px;
            border-bottom: 4px solid var(--accent-gold);
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            z-index: 100;
        }

        header h1 {
            font-family: 'Oswald', sans-serif;
            font-size: 2.2rem;
            letter-spacing: 4px;
            margin: 0;
            background: linear-gradient(to bottom, #fff 30%, var(--accent-gold) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        #main-container {
            flex-grow: 1;
            overflow-y: auto;
            padding: 25px;
            display: flex;
            justify-content: center;
        }

        #game-board {
            display: grid;
            grid-template-columns: repeat(5, 1fr); 
            gap: 12px;
            width: 100%;
            max-width: 1300px;
        }

        .category-title {
            font-family: 'Oswald', sans-serif;
            background: linear-gradient(145deg, #060ce9, #00055a);
            border: 2px solid var(--accent-gold);
            padding: 15px 5px;
            text-align: center;
            font-weight: 700;
            text-transform: uppercase;
            border-radius: 4px;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .card {
            background: linear-gradient(145deg, #060ce9, #0409a1);
            border: 2px solid rgba(255,255,255,0.4);
            aspect-ratio: 1.6 / 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Oswald', sans-serif;
            font-size: 2rem;
            color: var(--accent-gold);
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.3s ease;
        }

        .card:hover {
            transform: scale(1.05);
            border-color: var(--accent-gold);
            box-shadow: 0 0 20px var(--gold-glow);
        }

        .card.disabled {
            background: #000624;
            color: #112255;
            border-color: #0c163a;
            pointer-events: none;
        }

        #team-bar {
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 20px;
            background: rgba(0,0,0,0.85);
            border-top: 2px solid rgba(255,255,255,0.1);
        }

        .team-box {
            background: var(--glass);
            border: 2px solid rgba(255,255,255,0.1);
            padding: 15px 25px;
            min-width: 160px;
            text-align: center;
            border-radius: 12px;
            transition: 0.4s;
        }

        .active-turn {
            border-color: var(--accent-gold);
            background: rgba(6, 12, 233, 0.4);
            box-shadow: 0 0 25px var(--gold-glow);
            transform: scale(1.1);
        }

        #setup-overlay, #modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.96);
            z-index: 2000;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .setup-card {
            background: #000830;
            border: 2px solid var(--accent-gold);
            padding: 40px;
            width: 90%;
            max-width: 700px;
            text-align: center;
            border-radius: 15px;
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
        }

        /* TEAM SETUP ALIGNMENT FIX */
        #team-inputs {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .team-row {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 12px;
            width: 100%;
            height: 50px; /* Fixed height for consistent vertical spacing */
        }

        .t-name {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--accent-gold);
            color: white;
            padding: 0 15px;
            height: 100%;
            border-radius: 8px;
            text-align: center;
            font-size: 1.1rem;
            width: 80%; /* Box is always 80% regardless of button presence */
            text-transform: uppercase;
            box-sizing: border-box;
        }

        .remove-btn-container {
            width: 60px; /* Fixed width container for the button */
            display: flex;
            justify-content: flex-start;
            padding-left: 10px;
        }

        .remove-btn {
            background: var(--remove-red);
            color: white;
            border: none;
            border-radius: 8px;
            width: 50px;
            height: 100%;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #media-container {
            margin-bottom: 20px;
            width: 100%;
            display: none;
            background: #000;
            border-radius: 12px;
            border: 1px solid var(--accent-gold);
            overflow: hidden;
        }

        iframe, video { width: 100%; height: 400px; border: none; }

        .btn {
            font-family: 'Oswald', sans-serif;
            padding: 12px 24px;
            font-weight: 700;
            cursor: pointer;
            border: none;
            border-radius: 50px;
            text-transform: uppercase;
            transition: 0.2s;
        }

        .btn-nav { background: transparent; border: 2px solid var(--accent-gold); color: var(--accent-gold); }
        .btn-main { background: var(--accent-gold); color: #000; }
        .btn-stage { background: var(--accent-gold); color: #000; width: 100%; height: 60px; font-size: 1.5rem; border-radius: 30px; margin-top: 20px; }
    </style>
</head>
<body>

<div id="setup-overlay">
    <div class="setup-card">
        <h1 style="font-family:'Oswald'; letter-spacing: 2px; margin-bottom: 30px;">GAME SETUP</h1>
        <div id="team-inputs">
            <div class="team-row">
                <input type="text" class="t-name" placeholder="TEAM 1 NAME">
                <div class="remove-btn-container"></div>
            </div>
            <div class="team-row">
                <input type="text" class="t-name" placeholder="TEAM 2 NAME">
                <div class="remove-btn-container">
                    <button class="remove-btn" onclick="removeTeamInput(this)">✕</button>
                </div>
            </div>
            <div class="team-row">
                <input type="text" class="t-name" placeholder="TEAM 3 NAME">
                <div class="remove-btn-container">
                    <button class="remove-btn" onclick="removeTeamInput(this)">✕</button>
                </div>
            </div>
        </div>
        <button class="btn btn-nav" onclick="addTeamInput()" style="margin: 20px 0;">+ ADD TEAM</button>
        <button class="btn btn-stage" onclick="startGame()">ENTER STAGE</button>
    </div>
</div>

<header>
    <h1>JEOPARDY</h1>
    <button class="btn btn-nav" onclick="location.reload()">NEW GAME</button>
</header>

<div id="main-container">
    <div id="game-board"></div>
</div>

<div id="team-bar"></div>

<div id="modal" style="display:none;">
    <div class="modal-content">
        <h2 id="current-player-tag" style="color:var(--accent-gold); font-family:'Oswald';"></h2>
        <div id="media-container"></div>
        <div id="display-q" style="font-size: 2.2rem; margin-bottom: 30px;"></div>
        <div id="display-a" style="font-size: 1.8rem; color: var(--accent-gold); display: none; margin-bottom: 30px; font-weight:bold;"></div>
        <button id="reveal-btn" class="btn btn-main" onclick="revealAnswer()" style="width:100%;">REVEAL ANSWER</button>
        <div id="scoring-zone" style="display:none; flex-direction: column; gap: 20px;">
            <div style="display:flex; gap: 15px;">
                <button class="btn btn-correct" onclick="processResult('correct')">CORRECT</button>
                <button class="btn btn-wrong" onclick="processResult('wrong')">WRONG</button>
            </div>
        </div>
    </div>
</div>

<script>
    let teams = [];
    let currentTeamIndex = 0;
    let activeValue = 0;
    let activeCardNode = null;
    let gameData = null;

    async function loadData() {
        try {
            const response = await fetch('data/game_data.json');
            gameData = await response.json();
        } catch(e) { console.error("Data load failed."); }
    }

    function addTeamInput() {
        const container = document.getElementById('team-inputs');
        const count = container.querySelectorAll('.team-row').length + 1;
        const row = document.createElement('div');
        row.className = 'team-row';
        row.innerHTML = `
            <input type="text" class="t-name" placeholder="TEAM ${count} NAME">
            <div class="remove-btn-container">
                <button class="remove-btn" onclick="removeTeamInput(this)">✕</button>
            </div>
        `;
        container.appendChild(row);
    }

    function removeTeamInput(btn) {
        btn.closest('.team-row').remove();
        document.querySelectorAll('.t-name').forEach((inp, i) => {
            inp.placeholder = `TEAM ${i+1} NAME`;
        });
    }

    function startGame() {
        const nameInputs = document.querySelectorAll('.t-name');
        const teamBar = document.getElementById('team-bar');
        teamBar.innerHTML = '';
        teams = [];
        
        nameInputs.forEach((input, index) => {
            const name = input.value.trim().toUpperCase() || `TEAM ${index + 1}`;
            teams.push({ id: index, name, score: 0 });
            const div = document.createElement('div');
            div.className = 'team-box';
            div.id = `box-team-${index}`;
            div.innerHTML = `
                <div style="font-size:0.7rem; color:var(--accent-gold);">PLAYING</div>
                <div style="font-family:'Oswald'; font-size:1.2rem;">${name}</div>
                <div id="score-${index}" style="font-size:1.8rem; color:var(--accent-gold);">$0</div>
            `;
            teamBar.appendChild(div);
        });

        document.getElementById('setup-overlay').style.display = 'none';
        renderBoard();
    }

    function renderBoard() {
        const board = document.getElementById('game-board');
        board.innerHTML = '';
        if(!gameData) return;
        gameData.categories.forEach(cat => {
            const h = document.createElement('div');
            h.className = 'category-title';
            h.innerText = cat.name;
            board.appendChild(h);
        });
        const maxQ = Math.max(...gameData.categories.map(c => c.questions.length));
        for (let i = 0; i < maxQ; i++) {
            gameData.categories.forEach(cat => {
                const qObj = cat.questions[i];
                const card = document.createElement('div');
                card.className = 'card';
                if (qObj) {
                    const val = (qObj.value !== undefined) ? qObj.value : (i + 1) * 100;
                    card.innerText = `$${val}`;
                    card.onclick = () => openQuestion(qObj, val, card);
                } else {
                    card.style.visibility = 'hidden';
                }
                board.appendChild(card);
            });
        }
    }

    function getYouTubeID(url) {
        const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
        const match = url.match(regExp);
        return (match && match[2].length === 11) ? match[2] : null;
    }

    function openQuestion(qObj, val, node) {
        activeValue = val;
        activeCardNode = node;
        const mediaBox = document.getElementById('media-container');
        mediaBox.innerHTML = '';
        mediaBox.style.display = 'none';

        if (qObj.youtube) {
            const id = getYouTubeID(qObj.youtube);
            mediaBox.innerHTML = `<iframe src="https://www.youtube.com/embed/${id}?autoplay=1" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
            mediaBox.style.display = 'block';
        } else if (qObj.video) {
            mediaBox.innerHTML = `<video src="${qObj.video}" controls autoplay></video>`;
            mediaBox.style.display = 'block';
        } else if (qObj.image) {
            mediaBox.innerHTML = `<img src="${qObj.image}" style="max-width:100%; max-height:400px; object-fit:contain;">`;
            mediaBox.style.display = 'block';
        }

        document.getElementById('display-q').innerText = qObj.q;
        document.getElementById('display-a').innerText = qObj.a;
        document.getElementById('display-a').style.display = 'none';
        document.getElementById('modal').style.display = 'flex';
        document.getElementById('reveal-btn').style.display = 'block';
        document.getElementById('scoring-zone').style.display = 'none';
    }

    function revealAnswer() {
        document.getElementById('display-a').style.display = 'block';
        document.getElementById('reveal-btn').style.display = 'none';
        document.getElementById('scoring-zone').style.display = 'flex';
    }

    function processResult(type) {
        if (type === 'correct') teams[currentTeamIndex].score += activeValue;
        else teams[currentTeamIndex].score -= (activeValue / 2);
        
        updateScoreDisplay(currentTeamIndex);
        activeCardNode.classList.add('disabled');
        currentTeamIndex = (currentTeamIndex + 1) % teams.length;
        document.getElementById('modal').style.display = 'none';
        document.getElementById('media-container').innerHTML = '';
    }

    function updateScoreDisplay(idx) {
        const s = teams[idx].score;
        document.getElementById(`score-${idx}`).innerText = (s < 0 ? '-$' : '$') + Math.abs(s).toLocaleString();
    }

    loadData();
</script>
</body>
</html>
